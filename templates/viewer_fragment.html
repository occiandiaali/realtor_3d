<div style="width: 100%; height: 100%; position: relative">
  <canvas
    id="renderCanvas"
    style="width: 100%; height: 100%; touch-action: none; border-radius: 12px"
  ></canvas>

  <!-- Virtual Joystick Overlay for Mobile Browsers -->
  <div
    id="joystick-zone"
    style="
      position: absolute;
      bottom: 20px;
      left: 20px;
      width: 90px;
      height: 90px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 50%;
      display: none;
      touch-action: none;
    "
  >
    <div
      id="joystick-knob"
      style="
        position: absolute;
        top: 30px;
        left: 30px;
        width: 30px;
        height: 30px;
        background: #3b82f6;
        border-radius: 50%;
      "
    ></div>
  </div>
</div>

<script>
  (function init3DViewer() {
    const canvas = document.getElementById("renderCanvas");
    if (!canvas) return;

    const engine = new BABYLON.Engine(canvas, true);

    const createScene = function () {
      const scene = new BABYLON.Scene(engine);
      scene.clearColor = new BABYLON.Color3(0.06, 0.09, 0.16);

      // FPS Camera (WASD Enabled)
      const camera = new BABYLON.UniversalCamera(
        "FPSCamera",
        new BABYLON.Vector3(0, 1.6, -3),
        scene,
      );
      camera.attachControl(canvas, true);

      camera.keysUp.push(87); // W
      camera.keysDown.push(83); // S
      camera.keysLeft.push(65); // A
      camera.keysRight.push(68); // D
      camera.speed = 0.2;
      camera.angularSensibility = 3000;

      // Safe Lighting Initialization
      if (typeof BABYLON.HemisphereLight === "function") {
        new BABYLON.HemisphereLight(
          "hemiLight",
          new BABYLON.Vector3(0, 1, 0),
          scene,
        );
      } else if (typeof BABYLON.PointLight === "function") {
        new BABYLON.PointLight(
          "pointLight",
          new BABYLON.Vector3(0, 3, 0),
          scene,
        );
      }

      // Load generated PLY file from backend
      BABYLON.SceneLoader.Append(
        "",
        "{{ model_url }}",
        scene,
        function (scene) {
          scene.activeCamera = camera;
        },
        null,
        function (scene, message) {
          console.error("3D Load Error:", message);
        },
        ".ply",
      );

      return scene;
    };

    const scene = createScene();
    engine.runRenderLoop(() => scene.render());
    window.addEventListener("resize", () => engine.resize());

    // Onscreen Touch Joystick Handler
    if ("ontouchstart" in window) {
      const joystickZone = document.getElementById("joystick-zone");
      const joystickKnob = document.getElementById("joystick-knob");
      if (joystickZone && joystickKnob) {
        joystickZone.style.display = "block";

        let startX, startY;
        joystickZone.addEventListener("touchstart", (e) => {
          startX = e.touches[0].clientX;
          startY = e.touches[0].clientY;
        });

        joystickZone.addEventListener("touchmove", (e) => {
          let dx = e.touches[0].clientX - startX;
          let dy = e.touches[0].clientY - startY;
          let dist = Math.min(Math.hypot(dx, dy), 30);
          let angle = Math.atan2(dy, dx);

          let knobX = Math.cos(angle) * dist;
          let knobY = Math.sin(angle) * dist;
          joystickKnob.style.transform = `translate(${knobX}px, ${knobY}px)`;

          let camera = scene.getCameraByName("FPSCamera");
          if (camera) {
            camera.cameraDirection.z = -knobY * 0.004;
            camera.cameraDirection.x = knobX * 0.004;
          }
        });

        joystickZone.addEventListener("touchend", () => {
          joystickKnob.style.transform = `translate(0px, 0px)`;
        });
      }
    }
  })();
</script>
